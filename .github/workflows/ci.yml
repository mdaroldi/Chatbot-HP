name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.3"

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make lint-workflows

  unit:
    name: Unit tests (coverage gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: make install
      - run: make test
      - name: Coverage summary
        if: always()
        run: make coverage-summary >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration, corpus and model tests (real services, live HP manuals)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The same telemetry switches as the compose services (data governance).
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: make install
      # Only the open-source embedding models are cached, keyed by their pins (no
      # restore-keys, so a changed pin never restores old files; every file's SHA-256 is
      # checked on use anyway). No HP content is stored by GitHub: the manuals are never
      # cached or uploaded, and corpus assertions print identifiers, not text.
      - name: Restore the embedding model cache
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/models
          key: embedding-models-${{ hashFiles('backend/models.toml') }}
      # Downloads the manuals live from HP on every run and verifies them against the
      # pinned checksums in backend/corpus.toml; fetches any model the cache lacks.
      # Up to 3 attempts with backoff. Fails as CORPUS UNAVAILABLE (host unreachable),
      # CORPUS CHANGED UPSTREAM (checksum mismatch) or MODEL UNAVAILABLE / CHANGED
      # UPSTREAM, never as a test failure.
      - name: Download and verify the HP manuals and the pinned models
        run: make fetch-test-assets
      # Saved right after a good download, so a later test failure does not lose it.
      - name: Save the embedding model cache
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/models
          key: ${{ steps.models-cache.outputs.cache-primary-key }}
      # Same docker-compose.test.yml as locally; make tears it down even on failure.
      # Integration, corpus and model tests; the manuals were verified on disk above.
      - run: make test-int

  security:
    name: Security (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history, not only the last commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: make install
      - run: make security

  docker:
    name: Docker images (build and Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make images
      - run: make scan-images
      - run: make scan-config

  # The full stack on the stub provider: the contract between the backend, the UI and
  # the answer harness (ADR 0011), then the stack log audit. It is the one job that
  # writes a .env, from .env.example: stub provider, no key, and a Postgres password
  # generated here and masked before any step can print it. The manuals are downloaded
  # by the ingest service and stay inside its volume, which is removed at the end.
  stack:
    name: Full stack (stub LLM), UI and harness contract tests, log audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: make install
      - run: make images
      - name: Write .env from .env.example (stub provider, no key, generated password)
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${password}/" \
            -e "s/^LLM_PROVIDER=.*/LLM_PROVIDER=stub/" \
            -e "s/^ANTHROPIC_API_KEY=.*/ANTHROPIC_API_KEY=/" \
            -e "s/^LLM_STUB_TOKEN_DELAY_MS=.*/LLM_STUB_TOKEN_DELAY_MS=50/" \
            .env.example > .env
          grep -qx 'LLM_PROVIDER=stub' .env
          grep -qx 'ANTHROPIC_API_KEY=' .env
      - run: docker compose up --detach --wait
      - run: make test-ui-int
      - run: make test-eval-int
      # A failure prints container, canary id and line count only.
      - id: log-audit
        run: make test-log-audit
      # Raw container logs only when the audit passed or never ran: if it failed, the
      # lines may hold the canaries' surroundings, and these logs are public.
      - name: Container logs (failure, audit not failed)
        if: failure() && steps.log-audit.outcome != 'failure'
        run: docker compose logs --no-color --timestamps
      - if: always()
        run: docker compose down --volumes
