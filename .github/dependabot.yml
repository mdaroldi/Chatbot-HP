# Weekly, grouped dependency updates. Each group opens one PR per ecosystem and
# directory; the open-PR limit keeps review load bounded. The cooldown skips
# releases younger than a few days, so a broken or compromised release has time
# to be noticed and yanked before it is proposed.
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    # fastembed caps huggingface-hub below 2.0 (backend/pyproject.toml states it).
    # Dependabot widens that cap anyway, the resolver rejects 2.x and the whole job
    # fails. Lift this when fastembed allows 2.x.
    ignore:
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    # A Postgres major upgrade needs a new volume mount point (/var/lib/postgresql
    # from 18 on) and pg_upgrade for existing data: a decision, not a weekly bump.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      service-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
