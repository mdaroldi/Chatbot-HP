# Throwaway Postgres and Qdrant for `make test-int` only.
# Bound to 127.0.0.1 on non-default ports; credentials are obviously fake and
# must never be reused anywhere else. No volumes: every run starts empty.
name: hpdocs-test

services:
  postgres:
    image: postgres:17.9-alpine3.22@sha256:034839bd88128360cda25496ebdb1471e24a4aa09b937160c73df2bb51126308
    environment:
      POSTGRES_DB: hpdocs_it
      POSTGRES_USER: it_user
      POSTGRES_PASSWORD: it-throwaway-password-not-a-secret
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_user -d hpdocs_it"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0-unprivileged@sha256:8c215051dc7bc15221b5f89c100a84a4b04d0dd8497fb73e6fa86fc948d1a41d
    ports:
      - "127.0.0.1:56333:6333"
    healthcheck:
      # The image has bash but no curl: speak HTTP over /dev/tcp and expect 200.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 3s
      retries: 30
