# Answer key facts v1.0.0 (approved by Ana Paula, 2026-11-14) for the 70 questions of retrieval-v1.toml (v1.0.1).
# Written from the two HP manuals (PDF text), not from the index and not from any model answer.
# Matching rules are in the Phase 5 prompt, section 5: the answer is normalized (citation tags and
# Markdown markers removed, case-folded, whitespace collapsed, dashes and non-breaking spaces unified).
# A plain string is a substring match; a string starting with re: is re.search on the normalized
# (lower-case) answer. A group passes when any alternative matches; an answer passes when every
# group passes. Every fact below is stated in the manual text for the question's own product.
#
# Decisions for the harness:
# - Questions whose retrieval-v1 entry has a `context` (category follow_up) are evaluated here as
#   single-turn questions: each one names its product and is self-contained. Replay of earlier turns
#   is covered by the multi_turn slice in slices-v1.toml, not by these entries.
# - Ambiguous questions (category ambiguous) name no product. A passing answer covers what the
#   manuals say for both products, so each product has its own group.
# - warning_expected is set only where the manual puts a WARNING or CAUTION on the very text that
#   answers the question.
# - Do not edit after the freeze commit.

