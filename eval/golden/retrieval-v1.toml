# Golden retrieval set v1.0.1. Changes from v1.0.0: three anchors tightened after the preflight review.
# Written from the two HP manuals, not from the index. Questions are original wording.
# Anchors: a chunk satisfies an anchor when doc_id matches and ALL facts occur in its text.
# match = any: one satisfied anchor is enough; match = all: every anchor must be covered.
# The optional `section` field is deliberately unused in v1.0.0 (section_path format
# not confirmed). Do not edit questions or anchors after the freeze commit.

