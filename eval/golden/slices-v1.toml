# ================================================================ long_query

[[questions]]
id = "lq-001"
slice = "long_query"
split = "dev"
pair_of = "envy-factual-003"
turns = ["I just moved into a new apartment and I have been unpacking boxes all week. The printer sat in the garage for a month, and I plugged it in last night and went to bed. This morning it was completely dark and the display was off, and I wondered whether I had broken something, because my old printer from another brand never did that and I always left it running. I also checked the power strip and the wall socket, and both were fine, because the lamp plugged into the same strip was still on. My neighbour, who works in IT, said that some devices shut down on a timer to save electricity, but he could not remember the details for this brand, and I did not want to start pressing buttons at random. My partner says it probably has some kind of built-in energy saving feature, but I would like to know the specifics instead of guessing. So, for the HP ENVY 6000 specifically: after how much idle time does the printer power itself off completely?"]

[[questions]]
id = "lq-002"
slice = "long_query"
split = "dev"
pair_of = "omen-part-001"
turns = ["Hi, my nephew dropped my gaming laptop off a bed last weekend and the bottom panel now has a crack running across one corner. It still boots and everything seems to work, but there is a gap near the vent and I am worried about dust and about the fans being exposed. I already put a strip of tape over the crack as a temporary fix, but the tape keeps peeling off because the plastic is slightly warped, and I would like to sort it out properly before I travel for work next week, since I will be carrying the laptop in a backpack every day. My nephew has promised to pay for the repair, so I want to give him the right code and not guess. I have been looking at online shops and the listings are confusing, with a dozen different codes that all look similar and some that clearly belong to other models. I would rather order the exact genuine replacement from the official service documentation. What is the spare part number for the bottom cover of the OMEN 17?"]

[[questions]]
id = "lq-003"
slice = "long_query"
split = "dev"
pair_of = "envy-table-001"
turns = ["I was printing my daughter's school project, about forty pages, when the printer made a grinding noise and stopped halfway through. Now there is a number on the little display on the front panel and a light that will not stop blinking. The grinding noise lasted about five seconds, and the paper that was halfway through the printer looked fine when I peeked at it, so I do not think it is a simple jam. I also tried a different paper brand in case that mattered, with no change. I tried switching it off and on again and the same thing came back. I do not have the paper manual anymore because it was thrown away with the packaging, and the app on my phone only says something went wrong. The display shows E4. What does that code mean?"]

[[questions]]
id = "lq-004"
slice = "long_query"
split = "dev"
pair_of = "omen-procedure-001"
turns = ["I was in the middle of a long gaming session last night when the whole screen froze, the sound looped for a few seconds and then nothing. The mouse pointer would not move, the keyboard did nothing, caps lock would not even toggle its light, and the fans kept spinning at full speed. The game had been running for about three hours on a high graphics preset, the room was warm, and the laptop was sitting flat on a blanket, which I now realize may not have helped with the heat. I have a deadline for an online tournament in two hours, so I would like to get back to the game without losing the saved profile or breaking anything. I waited about ten minutes in case it was a driver crash that would recover on its own, but nothing changed, and I did not want to unplug it or pull the battery out because I read that could damage things. What do I do to force the laptop off when it has stopped responding?"]

[[questions]]
id = "lq-005"
slice = "long_query"
split = "dev"
pair_of = "omen-prereq-002"
turns = ["I bought my OMEN 17 two years ago with the smallest amount of memory available because money was tight, and now it struggles whenever I have a browser, a game launcher and a video call open at the same time. I have upgraded memory in desktop computers before, but never in a laptop, and I have heard that some laptop designs make it very easy while others need half the machine taken apart. I would like to do this myself instead of paying a shop, because the local shop quoted me almost as much as the memory itself costs, and I enjoy learning how my own equipment works. I will buy the compatible memory first and only open the machine when I am sure about the order of the steps. I also keep a magnetic tray for the screws, because I once lost one under the sofa for a week. I have a small screwdriver set, an anti-static strap and plenty of time this weekend. How do I swap a RAM module, and what do I have to do first?"]

[[questions]]
id = "lq-006"
slice = "long_query"
split = "dev"
pair_of = "envy-procedure-002"
turns = ["The printer has been fine for months, but this morning the black ink ran out in the middle of a page and the output came out with half the text missing. I bought a new cartridge at the electronics store yesterday after comparing prices for far too long, and it is sitting on my desk, still in its package. It is the correct model number according to the box, and the shop assistant even checked it twice. My cat has also discovered that the open paper tray is a nice place to sleep, so I have been closing everything between uses, in case that matters. I only have about twenty minutes before I have to leave for work, and I would like to do it carefully, not quickly. The printer is plugged in and switched on at the moment. I am a little nervous because the last time I tried to change an ink cartridge in a different printer I bent something and it never worked right again. How do I swap an empty ink cartridge for a new one on the ENVY 6000?"]

[[questions]]
id = "lq-007"
slice = "long_query"
split = "dev"
pair_of = "omen-factual-002"
turns = ["I am putting together a list of upgrades for my gaming laptop before a big tournament next month, and I want to be sure I only buy parts that will actually fit. I have a spreadsheet with every component, its price and the shop where I plan to order it, and the memory is the only line I am not sure about. The total budget is not huge, so I cannot afford to buy the wrong kind and return it, since returns here cost shipping both ways. I mainly play competitive shooters, so any extra memory should be fast. I already ordered a cooling pad and a new mouse. For the memory, a friend told me it is soldered on these days and cannot be upgraded at all, while another friend said it takes the same sticks as a desktop. I would like to check the official documentation instead of trusting either of them. What kind of memory does the OMEN 17 take, and how many slots does it have?"]

[[questions]]
id = "lq-008"
slice = "long_query"
split = "dev"
pair_of = "envy-warning-002"
turns = ["The glass on top of my multifunction printer has a few stubborn smudges and one faint fingerprint that shows up on every scan as a grey line down the page. I am in the middle of digitizing old family photographs for my grandmother's eightieth birthday, so I really do not want to damage anything. The photographs are in an old album and I only get one chance to scan them before my sister takes the album back to her house in another city. I have already tried blowing off the dust with a small brush, but the smudges are on the glass itself, not on the photos. I would rather get the cleaning right the first time. The printer is on and plugged in on my desk right now. I have a bottle of rubbing alcohol under the sink that I use for cleaning my phone screen and it works well there, so I wondered whether it would work here too. Is it fine to use rubbing alcohol on the scanner glass of the ENVY 6000?"]

[[questions]]
id = "lq-009"
slice = "long_query"
split = "heldout"
pair_of = "omen-part-008"
turns = ["I have just come back to the United Kingdom after three years abroad and brought my gaming laptop with me. The charger works, but the cable that came with it is the wrong kind of plug for the sockets here, and the cheap adapter I bought at the airport gets hot and feels unsafe. I live in a rented flat with old sockets, and the landlord already warned me about overloading the circuit, so I want to be careful about every electrical thing I plug in. The laptop is the 17.3 inch model with the dedicated graphics card, and it normally draws a lot of power when I play. A friend in London offered to sell me a cord she no longer uses, but she does not know which model it was made for, so I prefer to order a new one. I would prefer a proper replacement cord, ordered by the official spare part number, so that I do not get something poorly made. What is the spare part number for a UK power cord for the OMEN 17?"]

[[questions]]
id = "lq-010"
slice = "long_query"
split = "heldout"
pair_of = "envy-table-004"
turns = ["My printer asked to restart overnight, I assume to install some kind of firmware update, and when I came down this morning the front panel was showing a number I have never seen before and the printer would not respond to anything my laptop sent it. I checked the router and the internet connection is fine, and my other devices work normally. I also unplugged the printer for a minute and plugged it back in, but the same number came back when it started. I am working from home today and I have a stack of documents waiting to be printed for a meeting this afternoon, so I do not have much time. The printer is only about a year old and I have never had a problem with it before this. I would rather not call support until I know what to ask. The router is in the same room, about three meters away. I would like to understand what happened before I try anything else, in case I make it worse. The counter on the ENVY 6000 shows E9. What went wrong?"]

