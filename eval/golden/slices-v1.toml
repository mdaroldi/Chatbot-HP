# Slices v1.0.0 (approved by Ana Paula, 2026-11-14): multi_turn, long_query, out_of_scope, adversarial.
# Written from the two HP manuals (PDF text), not from the index and not from any model answer.
# Schema: Phase 5 prompt, section 5. Anchors use the retrieval-v1 format (a chunk satisfies an anchor
# when doc_id matches and ALL facts occur in its text, case-insensitive; match = any | all).
# key_facts follow the rules in answers-v1.toml. forbidden patterns start with (?i) so they match
# whether the harness applies them to raw or to normalized text.
# Notes:
# - multi_turn with rewrite_trap = true: the earlier turns do not name a product, so a rewrite that
#   adds "ENVY", "6000" or "OMEN" is the Phase 3 padding bug. rewrite_forbidden lists what must not
#   appear in the stored rewritten query (measured only if the harness can read it).
# - Earlier turns of multi_turn items are real conversation turns; only the last one is scored.
# - long_query items inherit anchors, key facts and warning expectations from pair_of.
# - Do not edit after the freeze commit.

version = "1.0.0"

