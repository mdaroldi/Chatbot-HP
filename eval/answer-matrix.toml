# Answer benchmark matrix for `make eval` (Phase 5, ADR 0012).
#
# Budget: a hard cap over the whole phase. Before each item, spent + that item's worst
# case must fit under cap_usd; before each run, spent + its estimate x start_margin must
# fit in what is left after the reserved runs. The ledger is git-ignored and append-only.
#
# Runs are in priority order: when the budget runs short, the last rows are cut first.
# Reserved runs (held-out, one improvement re-run) are funded up front, so a cut never
# reaches them. Owner levers after the pilot (2026-11-15): the judge sees in-scope items
# only (1a, in code); references 2-3 and the improvement re-run use answers-dev (2, 3),
# so the noise floor covers the primary metric and the slices run in reference 1. The
# pilot measured $0.0082 per answer, above the owner's $0.008 line: k3, sparse and k8
# stay as the last, conditional rows. Each runs only if its start check passes; a row
# that does not run is reported as "not run: budget". A run's env sets only allowlisted backend settings; everything else is
# the default stack. Item sets: dev (105 items), answers-dev (the 56 answers-v1 dev
# items), multi-turn-dev (10 items), heldout (30 items, one run only).

[budget]
cap_usd = 10.0
start_margin = 1.25
batch_discount = 0.5  # the judge runs through the Message Batches API
prices_as_of = "2026-11-03"
prices_source = "Anthropic first-party API standard prices (claude-api reference, cached 2026-11-03)"

[models]
answer = "claude-sonnet-5-5"
rewrite = "claude-haiku-5-5"
judge = "claude-opus-5-5"

[prices.claude-sonnet-5-5]
input_per_mtok = 2.0
output_per_mtok = 10.0

[prices.claude-haiku-5-5]
input_per_mtok = 0.1
output_per_mtok = 0.5

[prices.claude-opus-5-5]
input_per_mtok = 4.0
output_per_mtok = 20.0

# Per call, for the per-item hard stop. answer_output_tokens is LLM_ANSWER_MAX_TOKENS
# (thinking counts as output) and rewrite_output_tokens is LLM_REWRITE_MAX_TOKENS; the
# run's config check compares them with the backend. Input bounds are ceilings over the
# system prompt, history, excerpts and question; a measured call above its bound stops
# the run, because the hard stop would then be unsound.
[worst_case]
answer_input_tokens = 12000
answer_output_tokens = 2048
rewrite_input_tokens = 4000
rewrite_output_tokens = 100
judge_input_tokens = 9000
judge_output_tokens = 4000

# Typical per call, for the run start check. Replaced by the pilot's measured means.
[estimate]
answer_input_tokens = 4500
answer_output_tokens = 600
judge_input_tokens = 5000
judge_output_tokens = 1500

[bootstrap]
seed = 20261114
resamples = 2000

[[runs]]
name = "reference-1"
items = "dev"
judge = true
judge_repeat = 20  # re-judged items for the judge's repeatability

[[runs]]
name = "reference-2"
items = "answers-dev"

[[runs]]
name = "reference-3"
items = "answers-dev"

[[runs]]
name = "heldout"
items = "heldout"
judge = true
reserved = true

[[runs]]
name = "improvement"
items = "answers-dev"
reserved = true

[[runs]]
name = "hybrid-no-rerank"
items = "answers-dev"
env = { RETRIEVAL_RERANK_ENABLED = "false" }

[[runs]]
name = "dense"
items = "answers-dev"
env = { RETRIEVAL_MODE = "dense", RETRIEVAL_RERANK_ENABLED = "false" }

[[runs]]
name = "naive"
items = "answers-dev"
env = { QDRANT_COLLECTION_ALIAS = "hpdocs_chunks_naive" }

# Owner: right after the naive row; about $0.17, it tests the rewrite trap (descriptive).
[[runs]]
name = "rewrite-off"
items = "multi-turn-dev"
env = { CHAT_REWRITE_HISTORY_TURNS = "0" }

[[runs]]
name = "k3"
items = "answers-dev"
env = { RETRIEVAL_TOP_K = "3" }

[[runs]]
name = "sparse"
items = "answers-dev"
env = { RETRIEVAL_MODE = "sparse", RETRIEVAL_RERANK_ENABLED = "false" }

[[runs]]
name = "k8"
items = "answers-dev"
env = { RETRIEVAL_TOP_K = "8" }
