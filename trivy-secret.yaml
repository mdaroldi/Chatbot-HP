# Trivy secret scanning for `make scan-images`.
#
# The built-in gcp-service-account rule matches the literal "type": "service_account",
# which the Anthropic SDK (anthropic==2.6.0) writes in docstrings of its beta types, not
# in any credential. Trivy ORs an allow rule's path and regex, so an allow regex would
# silence the literal in every file. Instead the rule is replaced by the same rule
# with one path exemption: the SDK's own package directory. Every other secret rule
# still scans that directory, and this rule still scans everything else.
# Pinned by backend/tests/unit/test_trivy_secret_config.py.
disable-rules:
  - gcp-service-account
rules:
  - id: gcp-service-account-outside-anthropic-sdk
    category: Google
    title: Google (GCP) Service-account
    severity: CRITICAL
    regex: '\"type\": \"service_account\"'
    keywords:
      - '"type": "service_account"'
    allow-rules:
      - id: anthropic-sdk-docstrings
        description: The Anthropic SDK documents the literal in its beta types
        path: ^/?opt/venv/lib/python3\.12/site-packages/anthropic/
