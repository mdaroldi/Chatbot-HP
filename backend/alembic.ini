# Alembic configuration. Deliberately contains no database URL and no logging
# sections: env.py builds the engine with app.infra.db.create_engine (settings from
# environment variables) and logs through app.core.logging (JSON lines).

[alembic]
# Resolved relative to this file, so alembic works from any working directory.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Date-prefixed names keep migrations listed in creation order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
