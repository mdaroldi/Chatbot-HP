[project]
name = "hp-docs-backend"
version = "0.1.0"
description = "FastAPI backend for the HP Docs RAG chatbot"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "qdrant-client>=1.20.0",
    "httpx>=0.28.1",
    # Pinned model downloads (ADR 0006); fastembed caps it below 2.0, made explicit here.
    "huggingface-hub>=1.33.0,<2.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "types-pyyaml==6.0.12.20261030",
]

[tool.uv]
# Application, not a library: dependencies are installed, the code is not packaged.
package = false
# pypdfium2 comes with pdfplumber (unused for text). 5.15.1 (2026-11-07) and 5.15.2
# (2026-11-09) were under 5 days old when adopted on 2026-11-12, so the newest
# allowed release is pinned; lift this once a newer release has passed the cooldown.
# loguru comes with fastembed. 0.8.0 (2026-11-11) was under 5 days old when adopted on
# 2026-11-12 (fastembed 0.9.1 also caps it below 0.8); lift this after the cooldown.
# filelock comes with huggingface-hub; 4.2.10 (2026-11-09, a bug fix, no advisory) was
# under 5 days old on 2026-11-12, so 4.2.9 is pinned; lift this after the cooldown.
constraint-dependencies = ["pypdfium2==5.15.0", "loguru==0.7.3", "filelock==4.2.9"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF",
  "ASYNC", "PT", "RET", "ARG", "PL", "TRY", "ERA", "T20",
]
ignore = [
  "PLR2004", # magic values are fine in tests and HTTP status checks
  "TRY003",  # explicit exception messages are clearer than a subclass per message
]

[tool.ruff.lint.isort]
# backend/alembic/ holds migration scripts; the `alembic` import is the library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]
# Generated migrations always import op and sa, even when a revision uses neither.
"alembic/versions/*.py" = ["F401"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs real Postgres and Qdrant containers",
  "corpus: needs the real HP manuals (downloaded and verified into CORPUS_DIR)",
  "model: needs the real embedding models (downloaded into EMBEDDING_CACHE_DIR)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
