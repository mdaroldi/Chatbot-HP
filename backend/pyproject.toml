[project]
name = "hp-docs-backend"
version = "0.1.0"
description = "FastAPI backend for the HP Docs RAG chatbot"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
# Application, not a library: dependencies are installed, the code is not packaged.
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF",
  "ASYNC", "PT", "RET", "ARG", "PL", "TRY", "ERA", "T20",
]
ignore = [
  "PLR2004", # magic values are fine in tests and HTTP status checks
  "TRY003",  # explicit exception messages are clearer than a subclass per message
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: needs real Postgres and Qdrant containers"]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
