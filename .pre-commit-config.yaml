# Installed by `make setup`. Hook revisions are pinned by commit SHA.
# Lint/format/typecheck use the same tools and config as `make check`.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      # Each project's pyproject.toml is picked up for its own files.
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend)
        language: system
        entry: bash -c 'cd backend && uv run --frozen mypy'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy-frontend
        name: mypy (frontend)
        language: system
        entry: bash -c 'cd frontend && uv run --frozen mypy'
        files: ^frontend/.*\.py$
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged changes)
        language: docker_image
        entry: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --pre-commit --staged --redact --no-banner .
        pass_filenames: false
