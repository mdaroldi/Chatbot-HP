# Full stack: cp .env.example .env, then `docker compose up --build`.
# Only the API and the frontend are published, bound to BIND_ADDRESS (default
# 127.0.0.1). Postgres and Qdrant live on an internal network with no route out.
# Startup order (ADR 0007): postgres and qdrant healthy -> migrate -> ingest
# (builds the index only when it is not current) -> backend -> frontend.
name: hpdocs

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
  restart: unless-stopped

# The backend image runs the API, the migrations and the ingestion. Only the
# backend service builds it: services that share a build race to export the same
# tag when the build cache is empty ("image ... already exists").
x-backend-image: &backend-image
  image: hpdocs-backend:local
  # Same numeric non-root user as the image's USER, stated here so it holds
  # even if the image changes.
  user: "10001:10001"
  init: true

# One-shot jobs: run to completion once per `up`. The image healthcheck probes the
# API, which these containers never start.
x-one-shot: &one-shot
  restart: "no"
  # The image is built by the backend service and exists only locally.
  pull_policy: never
  healthcheck:
    disable: true

x-logging-env: &logging-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_INCLUDE_EXCEPTION_MESSAGES: ${LOG_INCLUDE_EXCEPTION_MESSAGES:-false}

# No third-party telemetry from the backend image. onnxruntime's Linux build carries
# Microsoft 1DS telemetry, started when its environment is created unless this is
# set (the embedder also calls onnxruntime's disable API). huggingface-hub otherwise
# adds environment details to its user agent and draws progress bars on stderr.
x-telemetry-env: &telemetry-env
  ORT_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-hpdocs}
  POSTGRES_USER: ${POSTGRES_USER:-hpdocs}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
  POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
  POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
  POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}

services:
  migrate:
    <<: [*one-shot, *hardening, *backend-image]
    entrypoint: ["alembic", "-c", "/app/alembic.ini"]
    command: ["upgrade", "head"]
    environment:
      <<: [*logging-env, *postgres-env, *telemetry-env]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}

  ingest:
    <<: [*one-shot, *hardening, *backend-image]
    # `make ingest` runs this service with --force instead.
    entrypoint: ["python", "-m", "app.ingestion"]
    command: ["--if-needed"]
    environment:
      <<: [*logging-env, *postgres-env, *telemetry-env]
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-hpdocs_chunks}
      INDEX_KEEP_PREVIOUS: ${INDEX_KEEP_PREVIOUS:-true}
      CORPUS_DIR: /var/cache/hpdocs/corpus
      CORPUS_MAX_BYTES: ${CORPUS_MAX_BYTES:-33554432}
      CORPUS_DOWNLOAD_TIMEOUT_SECONDS: ${CORPUS_DOWNLOAD_TIMEOUT_SECONDS:-120}
      EMBEDDING_DENSE_MODEL: ${EMBEDDING_DENSE_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_SPARSE_MODEL: ${EMBEDDING_SPARSE_MODEL:-Qdrant/bm25}
      EMBEDDING_CACHE_DIR: /var/cache/hpdocs/models
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-450}
      CHUNK_MIN_TOKENS: ${CHUNK_MIN_TOKENS:-65}
      # huggingface-hub and hf-xet write their own cache and logs under HF_HOME
      # (default ~/.cache); the root is read-only and the user has no home. The
      # verified model files still land in EMBEDDING_CACHE_DIR.
      HF_HOME: /tmp/huggingface
    # Verified PDFs and model files survive `down`, so later runs need no network.
    volumes:
      - corpus-cache:/var/cache/hpdocs/corpus
      - model-cache:/var/cache/hpdocs/models
    # edge: downloads the PDFs and the models; data: Postgres and Qdrant.
    networks: [edge, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      qdrant: {condition: service_healthy}

  backend:
    <<: [*hardening, *backend-image]
    build: ./backend
    environment:
      <<: [*logging-env, *postgres-env, *telemetry-env]
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2.0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks: [edge, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      ingest: {condition: service_completed_successfully}

  frontend:
    <<: *hardening
    build: ./frontend
    image: hpdocs-frontend:local
    # Same numeric non-root user as the image's USER, stated here so it holds
    # even if the image changes.
    user: "10001:10001"
    init: true
    environment:
      BACKEND_URL: http://backend:8000
      # Also off in the image's .streamlit/config.toml; either holds alone.
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8501}:8501"
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}

  postgres:
    <<: *hardening
    image: postgres:17.10-alpine3.22@sha256:b02d9b5bcf608c2719da32cdabee274a33841202487fd5dc9b065b63f886753f
    # Run as the image's postgres user (uid 70) from the start, so the entrypoint
    # needs no root capabilities to drop privileges.
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hpdocs}
      POSTGRES_USER: ${POSTGRES_USER:-hpdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    # /var/run/postgresql holds the Unix socket and lock file; the root fs is read-only.
    tmpfs: ["/tmp", "/var/run/postgresql"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  qdrant:
    <<: *hardening
    image: qdrant/qdrant:v1.20.0-unprivileged@sha256:8c215051dc7bc15221b5f89c100a84a4b04d0dd8497fb73e6fa86fc948d1a41d
    environment:
      # No usage telemetry to telemetry.qdrant.io (the data network has no route out).
      QDRANT__TELEMETRY_DISABLED: "true"
    # Qdrant needs a writable snapshots directory at startup; read_only stays on.
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks: [data]
    healthcheck:
      # The image has bash but no curl: speak HTTP over /dev/tcp and require 200.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  edge: {}
  data:
    internal: true

volumes:
  postgres-data:
  qdrant-data:
  qdrant-snapshots:
  corpus-cache:
  model-cache:
