# Full stack: cp .env.example .env, then `docker compose up --build`.
# Only the API and the frontend are published, bound to BIND_ADDRESS (default
# 127.0.0.1). Postgres and Qdrant live on an internal network with no route out.
# Startup order (ADR 0007): postgres and qdrant healthy -> migrate -> ingest
# (builds the index only when it is not current) -> backend -> frontend.
name: hpdocs

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
  restart: unless-stopped

# The backend image runs the API, the migrations and the ingestion. Only the
# backend service builds it: services that share a build race to export the same
# tag when the build cache is empty ("image ... already exists").
x-backend-image: &backend-image
  image: hpdocs-backend:local
  # Same numeric non-root user as the image's USER, stated here so it holds
  # even if the image changes.
  user: "10001:10001"
  init: true

# One-shot jobs: run to completion once per `up`. The image healthcheck probes the
# API, which these containers never start.
x-one-shot: &one-shot
  restart: "no"
  # The image is built by the backend service and exists only locally.
  pull_policy: never
  healthcheck:
    disable: true

x-logging-env: &logging-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_INCLUDE_EXCEPTION_MESSAGES: ${LOG_INCLUDE_EXCEPTION_MESSAGES:-false}

# No third-party telemetry from the backend image. onnxruntime's Linux build carries
# Microsoft 1DS telemetry, started when its environment is created unless this is
# set (the embedder also calls onnxruntime's disable API). huggingface-hub otherwise
# adds environment details to its user agent and draws progress bars on stderr.
# HF_HUB_OFFLINE: the models are baked into the image (ADR 0008), so the hub library
# never reaches the network. The image sets all four too; either holds alone.
x-telemetry-env: &telemetry-env
  ORT_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  HF_HUB_OFFLINE: "1"

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-hpdocs}
  POSTGRES_USER: ${POSTGRES_USER:-hpdocs}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
  POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
  POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
  POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}

services:
  migrate:
    <<: [*one-shot, *hardening, *backend-image]
    entrypoint: ["alembic", "-c", "/app/alembic.ini"]
    command: ["upgrade", "head"]
    environment:
      <<: [*logging-env, *postgres-env, *telemetry-env]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}

  ingest:
    <<: [*one-shot, *hardening, *backend-image]
    # `make ingest` runs this service with --force instead.
    entrypoint: ["python", "-m", "app.ingestion"]
    command: ["--if-needed"]
    environment:
      <<: [*logging-env, *postgres-env, *telemetry-env]
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-hpdocs_chunks}
      INDEX_KEEP_PREVIOUS: ${INDEX_KEEP_PREVIOUS:-true}
      CORPUS_DIR: /var/cache/hpdocs/corpus
      CORPUS_MAX_BYTES: ${CORPUS_MAX_BYTES:-33554432}
      CORPUS_DOWNLOAD_TIMEOUT_SECONDS: ${CORPUS_DOWNLOAD_TIMEOUT_SECONDS:-120}
      EMBEDDING_DENSE_MODEL: ${EMBEDDING_DENSE_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_SPARSE_MODEL: ${EMBEDDING_SPARSE_MODEL:-Qdrant/bm25}
      # The read-only model store baked into the image (ADR 0008).
      EMBEDDING_CACHE_DIR: /opt/hpdocs/models
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_BM25_AVG_LEN: ${EMBEDDING_BM25_AVG_LEN:-256}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-450}
      CHUNK_MIN_TOKENS: ${CHUNK_MIN_TOKENS:-65}
      # huggingface-hub and hf-xet write their own cache and logs under HF_HOME
      # (default ~/.cache); the root is read-only and the user has no home. The
      # verified model files still land in EMBEDDING_CACHE_DIR.
      HF_HOME: /tmp/huggingface
    # Verified PDFs survive `down`, so later runs need no network.
    volumes:
      - corpus-cache:/var/cache/hpdocs/corpus
    # edge: downloads the PDFs; data: Postgres and Qdrant.
    networks: [edge, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      qdrant: {condition: service_healthy}

  backend:
    <<: [*hardening, *backend-image]
    build: ./backend
    environment:
      <<: [*logging-env, *postgres-env, *telemetry-env]
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-hpdocs_chunks}
      QDRANT_SEARCH_TIMEOUT_SECONDS: ${QDRANT_SEARCH_TIMEOUT_SECONDS:-2.0}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2.0}
      # Retrieval (ADR 0009); the defaults equal the code's, so an unset .env changes nothing.
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-true}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_RERANK_CANDIDATES: ${RETRIEVAL_RERANK_CANDIDATES:-20}
      RETRIEVAL_PREFETCH_DENSE_LIMIT: ${RETRIEVAL_PREFETCH_DENSE_LIMIT:-20}
      RETRIEVAL_PREFETCH_SPARSE_LIMIT: ${RETRIEVAL_PREFETCH_SPARSE_LIMIT:-20}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_PRODUCT_FILTER_ENABLED: ${RETRIEVAL_PRODUCT_FILTER_ENABLED:-false}
      RETRIEVAL_RELEVANCE_THRESHOLD: ${RETRIEVAL_RELEVANCE_THRESHOLD:--6.54}
      RETRIEVAL_DENSE_QUERY_PREFIX: ${RETRIEVAL_DENSE_QUERY_PREFIX:-}
      QUERY_MAX_CHARS: ${QUERY_MAX_CHARS:-1000}
      # Rate limits (in memory, per replica): chat by X-Client-ID, search by it or IP.
      RATE_LIMIT_CONVERSATIONS_PER_MINUTE: ${RATE_LIMIT_CONVERSATIONS_PER_MINUTE:-120}
      RATE_LIMIT_CONVERSATIONS_BURST: ${RATE_LIMIT_CONVERSATIONS_BURST:-30}
      RATE_LIMIT_SEARCH_PER_MINUTE: ${RATE_LIMIT_SEARCH_PER_MINUTE:-30}
      RATE_LIMIT_SEARCH_BURST: ${RATE_LIMIT_SEARCH_BURST:-10}
      RATE_LIMIT_MESSAGES_PER_MINUTE: ${RATE_LIMIT_MESSAGES_PER_MINUTE:-10}
      RATE_LIMIT_MESSAGES_BURST: ${RATE_LIMIT_MESSAGES_BURST:-5}
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-10000}
      # Language models and chat budgets; the key comes only from .env.
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_REFUSAL_FALLBACK_ENABLED: ${LLM_REFUSAL_FALLBACK_ENABLED:-true}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5.0}
      LLM_FIRST_TOKEN_TIMEOUT_SECONDS: ${LLM_FIRST_TOKEN_TIMEOUT_SECONDS:-30.0}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_ANSWER_MODEL: ${LLM_ANSWER_MODEL:-claude-opus-5-5}
      LLM_ANSWER_EFFORT: ${LLM_ANSWER_EFFORT:-low}
      LLM_ANSWER_MAX_TOKENS: ${LLM_ANSWER_MAX_TOKENS:-2048}
      LLM_REWRITE_MODEL: ${LLM_REWRITE_MODEL:-claude-haiku-5-5}
      LLM_REWRITE_EFFORT: ${LLM_REWRITE_EFFORT:-low}
      LLM_REWRITE_MAX_TOKENS: ${LLM_REWRITE_MAX_TOKENS:-100}
      LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-120.0}
      LLM_REWRITE_TIMEOUT_SECONDS: ${LLM_REWRITE_TIMEOUT_SECONDS:-5.0}
      LLM_STUB_TOKEN_DELAY_MS: ${LLM_STUB_TOKEN_DELAY_MS:-0}
      CHAT_HISTORY_MAX_TURNS: ${CHAT_HISTORY_MAX_TURNS:-6}
      CHAT_HISTORY_MAX_TOKENS: ${CHAT_HISTORY_MAX_TOKENS:-3000}
      CHAT_REWRITE_HISTORY_TURNS: ${CHAT_REWRITE_HISTORY_TURNS:-3}
      CHAT_REWRITE_HISTORY_TOKENS: ${CHAT_REWRITE_HISTORY_TOKENS:-1000}
      CHAT_MESSAGE_MAX_CHARS: ${CHAT_MESSAGE_MAX_CHARS:-1000}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15.0}
      CHAT_SNIPPET_CHARS: ${CHAT_SNIPPET_CHARS:-160}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      RETENTION_PURGE_INTERVAL_MINUTES: ${RETENTION_PURGE_INTERVAL_MINUTES:-60}
      # The debug search endpoint (chunk text); a startup warning when on in production.
      SEARCH_ENDPOINT_ENABLED: ${SEARCH_ENDPOINT_ENABLED:-false}
      # Query models (ADR 0008): read offline from the store baked into the image.
      EMBEDDING_DENSE_MODEL: ${EMBEDDING_DENSE_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_SPARSE_MODEL: ${EMBEDDING_SPARSE_MODEL:-Qdrant/bm25}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_CACHE_DIR: /opt/hpdocs/models
      RERANKER_MODEL: ${RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      INFERENCE_WORKERS: ${INFERENCE_WORKERS:-2}
      INFERENCE_ONNX_THREADS: ${INFERENCE_ONNX_THREADS:-2}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks: [edge, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      ingest: {condition: service_completed_successfully}

  frontend:
    <<: *hardening
    build: ./frontend
    image: hpdocs-frontend:local
    # Same numeric non-root user as the image's USER, stated here so it holds
    # even if the image changes.
    user: "10001:10001"
    init: true
    environment:
      BACKEND_URL: http://backend:8000
      # Also off in the image's .streamlit/config.toml; either holds alone.
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8501}:8501"
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}

  postgres:
    <<: *hardening
    image: postgres:17.10-alpine3.22@sha256:b02d9b5bcf608c2719da32cdabee274a33841202487fd5dc9b065b63f886753f
    # Run as the image's postgres user (uid 70) from the start, so the entrypoint
    # needs no root capabilities to drop privileges.
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hpdocs}
      POSTGRES_USER: ${POSTGRES_USER:-hpdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    # /var/run/postgresql holds the Unix socket and lock file; the root fs is read-only.
    tmpfs: ["/tmp", "/var/run/postgresql"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  qdrant:
    <<: *hardening
    image: qdrant/qdrant:v1.20.0-unprivileged@sha256:8c215051dc7bc15221b5f89c100a84a4b04d0dd8497fb73e6fa86fc948d1a41d
    environment:
      # No usage telemetry to telemetry.qdrant.io (the data network has no route out).
      QDRANT__TELEMETRY_DISABLED: "true"
    # Qdrant needs a writable snapshots directory at startup; read_only stays on.
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks: [data]
    healthcheck:
      # The image has bash but no curl: speak HTTP over /dev/tcp and require 200.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  edge: {}
  data:
    internal: true

volumes:
  postgres-data:
  qdrant-data:
  qdrant-snapshots:
  corpus-cache:
